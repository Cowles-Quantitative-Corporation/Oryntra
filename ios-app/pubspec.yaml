name: oryntra_ai
description: Oryntra AI market intelligence and simulated paper-trading client for iOS with a safe Flutter web preview.
publish_to: none
version: 1.0.0+19

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/oryntra-icon.png
